    <main>
      <div class="task-box">

        <div class="watchButtons">

          <button class="watchBtn" id="stop">Stop</button>

      </div>
      <div class="todo task-box">
        <input type="text" id="taskInput" placeholder="Enter your task" />
        <button id="add">add</button>
        <ul id="list"></ul>
      </div>
    </main>

    <div class="fortune-area task-box">
      <div class="container" id="fortune">First box!</div>

      <div class="buttons">
        <button class="btn" id="btn1"></button>
        <button class="btn" id="btn2"></button>
        <button class="btn" id="btn3"></button>

    <footer></footer>
